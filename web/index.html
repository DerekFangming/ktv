<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Player</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/vendor/hls.min.js"></script>
  </head>
  <body class="player-page">
    <main>
      <header id="player-header">
        <h2 id="now-playing">No song is currently playing. Scan the QR code to pick a song.</h2>
      </header>
      <div id="stage">
        <video id="player" controls controlsList="nofullscreen" playsinline></video>
        <div id="fs-caption">
          <p id="fs-title"></p>
          <p id="fs-detail"></p>
        </div>
        <div id="player-tools">
          <button id="fs-toggle" type="button">Fullscreen</button>
          <a id="controls-code" href="/controls" title="Scan to open controls">
            <img src="/controls-code.png" alt="QR code for the controls page" width="88" height="88" />
          </a>
        </div>
        <div id="overlay" class="hidden">
          <div class="spinner"></div>
          <p id="overlay-text">Preparing stream…</p>
        </div>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
